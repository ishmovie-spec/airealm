<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Construction</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:#0d1117;
    color:#fff;
}

body::before{
    content:"";
    position:absolute;
    width:300%;
    height:300%;
    background:
        radial-gradient(circle,#00d4ff22 2px,transparent 2px);
    background-size:50px 50px;
    animation:move 40s linear infinite;
}

@keyframes move{
    from{transform:translate(0,0);}
    to{transform:translate(-400px,-400px);}
}

.container{
    position:relative;
    z-index:2;
    max-width:700px;
    width:90%;
    text-align:center;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(12px);
    padding:50px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 0 40px rgba(0,212,255,.15);
}

.icon{
    font-size:80px;
    animation:rotate 6s linear infinite;
}

@keyframes rotate{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

h1{
    margin-top:20px;
    font-size:48px;
    letter-spacing:2px;
}

p{
    margin:20px auto;
    line-height:1.8;
    color:#d0d0d0;
    font-size:18px;
}

.progress{
    width:100%;
    height:14px;
    background:#1d2733;
    border-radius:30px;
    overflow:hidden;
    margin:35px 0;
}

.bar{
    height:100%;
    width:70%;
    background:linear-gradient(90deg,#00d4ff,#00ffa6);
    animation:loading 4s ease-in-out infinite;
}

@keyframes loading{
    0%{width:10%;}
    50%{width:75%;}
    100%{width:10%;}
}

.countdown{
    display:flex;
    justify-content:center;
    gap:25px;
    margin-bottom:35px;
}

.box{
    background:rgba(255,255,255,.08);
    padding:15px;
    border-radius:12px;
    min-width:80px;
}

.box span{
    display:block;
    font-size:30px;
    font-weight:bold;
    color:#00d4ff;
}

.box small{
    color:#ccc;
}

.button{
    display:inline-block;
    margin-top:15px;
    padding:15px 35px;
    text-decoration:none;
    color:#fff;
    background:linear-gradient(90deg,#00d4ff,#008cff);
    border-radius:50px;
    transition:.3s;
    font-weight:bold;
}

.button:hover{
    transform:translateY(-3px);
    box-shadow:0 0 20px #00d4ff;
}

footer{
    margin-top:35px;
    color:#888;
    font-size:14px;
}

@media(max-width:600px){
    h1{
        font-size:34px;
    }

    .countdown{
        gap:10px;
    }

    .box{
        min-width:65px;
        padding:12px;
    }

    .box span{
        font-size:22px;
    }
}
</style>

</head>
<body>

<div class="container">

<div class="icon">⚙️</div>

<h1>Under Construction</h1>

<p>
We're working hard to build something amazing.
Our website will be launching soon.
Thank you for your patience!
</p>

<div class="progress">
<div class="bar"></div>
</div>

<div class="countdown">
<div class="box">
<span id="days">00</span>
<small>Days</small>
</div>

<div class="box">
<span id="hours">00</span>
<small>Hours</small>
</div>

<div class="box">
<span id="minutes">00</span>
<small>Minutes</small>
</div>

<div class="box">
<span id="seconds">00</span>
<small>Seconds</small>
</div>
</div>

<a class="button" href="mailto:info@example.com">Contact Us</a>

<footer>
© 2026 Your Company. All Rights Reserved.
</footer>

</div>

<script>

// Launch Date
const launchDate = new Date("December 31, 2026 23:59:59").getTime();

setInterval(function(){

const now = new Date().getTime();
const distance = launchDate - now;

const days = Math.floor(distance/(1000*60*60*24));
const hours = Math.floor((distance%(1000*60*60*24))/(1000*60*60));
const minutes = Math.floor((distance%(1000*60*60))/(1000*60));
const seconds = Math.floor((distance%(1000*60))/1000);

document.getElementById("days").innerHTML = days;
document.getElementById("hours").innerHTML = hours;
document.getElementById("minutes").innerHTML = minutes;
document.getElementById("seconds").innerHTML = seconds;

},1000);

</script>

</body>
</html>
